services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ap-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_PIN: ${ADMIN_PIN:-1234}
      MONGODB_URI: ${MONGODB_URI:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://localhost}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: ap-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

  # Optional MongoDB (enable with: docker-compose --profile mongo up -d)
  mongodb:
    image: mongo:7
    container_name: ap-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    profiles:
      - mongo

volumes:
  mongo_data:
